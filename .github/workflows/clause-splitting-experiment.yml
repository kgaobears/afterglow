name: Plain-text clause splitting experiment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clause-splitting-experiment.yml'
      - 'scripts/experiment-clause-splitting.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Qwen
        shell: bash
        run: |
          ollama serve > "$RUNNER_TEMP/ollama-server.log" 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then break; fi
            sleep 2
          done
          ollama pull qwen2.5:1.5b
      - name: Compare original and segmented notes
        run: node --import tsx scripts/experiment-clause-splitting.mjs
      - name: Upload full pass logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splitting-experiment-${{ github.run_number }}
          path: |
            outputs/split-experiment.json
            ${{ runner.temp }}/ollama-server.log
          retention-days: 14
