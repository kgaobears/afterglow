name: Real Qwen extraction regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/real-model-regression.yml'
      - 'app/local-inference.ts'
      - 'app/atomization.ts'
      - 'app/memory-parser.ts'
      - 'app/source-verification.ts'
      - 'app/extraction-regression.ts'
      - 'app/complex-extraction-fixtures.ts'
      - 'app/fact-type.ts'
      - 'app/temporal-facts.ts'
      - 'scripts/run-model-regression.mjs'

permissions:
  contents: read

concurrency:
  group: afterglow-real-model-regression
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Afterglow
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic pipeline tests
        run: npm run test:regression

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and download Qwen
        shell: bash
        run: |
          ollama serve > "$RUNNER_TEMP/ollama-server.log" 2>&1 &
          ready=0
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "Ollama did not become ready" >&2
            exit 1
          fi
          ollama pull qwen2.5:1.5b

      - name: Run real-model regression with full diagnostics
        shell: bash
        run: |
          mkdir -p outputs
          npm run test:model -- --coverage --temporal --output outputs/model-regression.json

      - name: Score complex Qwen scenarios (diagnostic, non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          npm run test:model -- --complex --coverage --temporal --output outputs/complex-model-regression.json

      - name: Upload pass-by-pass model logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-regression-logs-${{ github.run_number }}
          path: |
            outputs/model-regression.json
            outputs/complex-model-regression.json
            ${{ runner.temp }}/ollama-server.log
          if-no-files-found: warn
          retention-days: 14
