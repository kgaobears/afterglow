name: Qwen 3B extraction benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen-3b-benchmark.yml'

permissions:
  contents: read

concurrency:
  group: afterglow-qwen-3b-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Afterglow
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic scorer checks
        run: npm run test:regression

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and download Qwen 2.5 3B
        shell: bash
        run: |
          ollama serve > "$RUNNER_TEMP/ollama-server.log" 2>&1 &
          ready=0
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "Ollama did not become ready" >&2
            exit 1
          fi
          ollama pull qwen2.5:3b

      - name: Run baseline 3B regression
        id: baseline
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p outputs
          npm run test:model -- --model qwen2.5:3b --coverage --temporal --output outputs/qwen3b-baseline.json

      - name: Run complex 3B regression regardless of baseline failures
        if: ${{ !cancelled() }}
        id: complex
        continue-on-error: true
        shell: bash
        run: |
          npm run test:model -- --model qwen2.5:3b --complex --coverage --temporal --output outputs/qwen3b-complex.json

      - name: Upload model prompts, responses, and scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3b-benchmark-logs-${{ github.run_number }}
          path: |
            outputs/qwen3b-baseline.json
            outputs/qwen3b-complex.json
            ${{ runner.temp }}/ollama-server.log
          if-no-files-found: warn
          retention-days: 14
